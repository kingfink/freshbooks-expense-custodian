[project]
name = "freshbooks-expense-custodian"
version = "0.1.0"
description = "Conservative FreshBooks expense vendor and category routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "modal>=1.3.5,<2",
  "pydantic-ai-slim[openai]>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
